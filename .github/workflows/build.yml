
      - name: Locate and Verify Firebase Resources
        run: |
          echo "Searching for generated Firebase resources..."

          find app/build -type f \( \
            -name "values.xml" -o \
            -name "google-services.json" \
          \) -print

          echo "Checking generated Web Client ID..."

          FILE=$(find app/build/generated -type f -name "values.xml" | grep "google-services" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No generated Google Services values.xml found."
            echo "Checking Google Services plugin output..."
            find app/build -type d | grep -i google-services || true
            exit 1
          fi

          echo "Found file: $FILE"

          grep -A 1 -B 1 "default_web_client_id" "$FILE" || true
          grep -A 1 -B 1 "google_app_id" "$FILE" || true
