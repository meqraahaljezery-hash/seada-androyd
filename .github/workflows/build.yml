name: Build Maqraah Android APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK and Diagnose Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Project Files
        run: |
          echo "========== PROJECT FILES =========="
          pwd
          ls -la
          ls -la app || true

      - name: Verify Firebase JSON
        run: |
          FILE="app/google-services.json"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: google-services.json is missing!"
            exit 1
          fi

          echo "Firebase JSON found."

          echo "Package names:"
          grep -n '"package_name"' "$FILE" || true

          echo "Project information:"
          grep -n '"project_id"' "$FILE" || true

      # ==========================================
      # الخطوة الجديدة: فك تشفير مفتاح التوقيع
      # ==========================================
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/my-release-key.jks

      # ==========================================
      # خطوة البناء المعدلة: استخدام مفتاح التوقيع
      # ==========================================
      - name: Build Debug APK
        run: |
          gradle --no-daemon assembleDebug --stacktrace \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Diagnose Firebase Resources
        if: always()
        run: |
          echo "========== BUILD STATUS =========="

          if [ -d "app/build" ]; then
            find app/build -maxdepth 7 -type f | head -n 200
          else
            echo "app/build directory does not exist"
          fi

          echo "========== GENERATED WEB CLIENT ID =========="

          find app/build -type f -name "values.xml" -print0 2>/dev/null |
          while IFS= read -r -d '' FILE; do
            if grep -q "default_web_client_id" "$FILE"; then
              echo "Found in: $FILE"
              grep "default_web_client_id" "$FILE"
            fi
          done

          echo "========== GENERATED FIREBASE APP ID =========="

          find app/build -type f -name "values.xml" -print0 2>/dev/null |
          while IFS= read -r -d '' FILE; do
            if grep -q "google_app_id" "$FILE"; then
              echo "Found in: $FILE"
              grep "google_app_id" "$FILE"
            fi
          done

      - name: Extract APK Certificate Fingerprints
        if: always()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            exit 0
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "========== APK CERTIFICATE =========="

          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Maqraah-Imam-Al-Jazari-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14